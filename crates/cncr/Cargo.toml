[package]
name = "cncr"
description = "CNC controller server for Grbl, Marlin, Smoothieware and TinyG/g2core (Rust rewrite of the cncjs backend)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cncr"
path = "src/main.rs"

[dependencies]
cncr-core.workspace = true
cncr-grbl.workspace = true
cncr-marlin.workspace = true
cncr-smoothie.workspace = true
cncr-tinyg.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
bcrypt = "0.17"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
